<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Anomaly Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <header class="dashboard-header">
            <h1>Log Anomaly Detector</h1>
            <button id="darkModeToggle" class="control-button">Toggle Dark Mode</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Logs</span>
                <span id="totalLogs" class="stat-value">{{ total_logs }}</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Normal</span>
                <span id="normalCount" class="stat-value normal-text">{{ normal_count }}</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Anomaly</span>
                <span id="anomalyCount" class="stat-value anomaly-text">{{ anomaly_count }}</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Active Sessions</span>
                <span id="sessionCount" class="stat-value">0</span>
            </div>
        </section>
        
        <section class="log-section">
            <h2>Live Log Feed</h2>
            <div id="logsContainer" class="scrollable-content" style="max-height: 350px;">
                <table id="logsTable" class="log-table">
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="alerts-section">
            <h2>Critical Alerts</h2>
            <div id="alertsContainer" class="scrollable-content" style="max-height: 250px;"></div>
        </section>

        <section class="controls-area">
            <div class="chart-container" style="height: 280px;">
                <canvas id="logChart"></canvas>
            </div>
            <div class="filter-controls">
                <h3>Filter Logs</h3>
                <input type="text" id="keywordSearch" class="select-dropdown" placeholder="Search by keyword...">
                <label for="startTime">From:</label>
                <input type="datetime-local" id="startTime" class="select-dropdown" title="Start Time">
                <label for="endTime">To:</label>
                <input type="datetime-local" id="endTime" class="select-dropdown" title="End Time">
                <select id="logFilter" class="select-dropdown">
                    <option value="all">All Log Types</option>
                    <option value="normal">Normal</option>
                    <option value="anomaly">Anomaly</option>
                </select>
                <button id="applyFiltersBtn" class="control-button">Apply Filters</button>
            </div>
        </section>

        <section class="log-section">
            <h2>Historical Trends (Anomalies per Hour)</h2>
            <div class="horizontal-scroll-wrapper">
                <div class="chart-container-wide">
                    <canvas id="historicalChart"></canvas>
                </div>
            </div>
        </section>

        <footer class="dashboard-footer">
            <div class="last-updated">Last Updated: <span id="lastUpdated">{{ last_updated }}</span></div>
            <span>Powered by cyberRKSha | &copy; 2025</span>
        </footer>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        // This script block remains the same
        window.onload = () => {
            initChart();
            initHistoricalChart();
            setupEventListeners(); 

            const lenis = new Lenis({ duration: 1.2 });
            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);
        };
    </script>
</body>
</html>
