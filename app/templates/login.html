<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Log Anomaly Detector</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/a_styles.css">
</head>
<body class="dark-mode">
    <div class="background-shapes"></div>
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p>Please log in to access the dashboard.</p>
        <form id="login-form">
            <div class="input-group">
                <input type="text" name="username" id="username" placeholder=" " required>
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="control-button">Log In</button>
        </form>
        <div id="error-message" class="error-message"></div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.textContent = '';
            const formData = new FormData(form);
            const response = await fetch('/login', { // Changed from /token
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                // The server now handles redirects, so we just follow it.
                window.location.href = response.url;
            } else {
                errorMessage.textContent = 'Incorrect username or password.';
            }
        });
    </script>
</body>
</html>
