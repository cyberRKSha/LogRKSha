<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review Logs - Log Anomaly Detector</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/r_styles.css">
    <link rel="stylesheet" href="/static/css/m_styles.css">
</head>
<body>
    <div id="review-interface-container" class="review-container">
        <div class="review-header">
            <h1>Log Review</h1>
            <a href="/" id="close-review-btn" class="control-button">Back to Dashboard</a>
        </div>

        <div class="review-tabs">
            <button class="tab-btn active" data-tab="smart-review">Smart Review</button>
            <button class="tab-btn" data-tab="manual-review">Manual Review</button>
        </div>

        <div id="smart-review" class="tab-content active">
            <div class="review-header">
                <h2>Review by Cluster</h2>
                <button id="prepare-clusters-btn" class="control-button">Prepare Clusters</button>
            </div>
            <div class="smart-review-controls">
                <div>
                    <label for="clusterSortBy">Sort Clusters By:</label>
                    <select id="clusterSortBy" class="select-dropdown">
                        <option value="log_count">Quantity</option>
                        <option value="confidence">Lowest Confidence</option>
                        <option value="last_seen">Most Recent</option>
                        <option value="name">Name</option>
                    </select>
                </div>
            </div>
            <div id="cluster-container" class="clusters-grid">
                </div>
            <div class="review-header" style="margin-top: 40px;">
                <h2>Unclustered Logs (Noise Bin)</h2>
            </div>
            <div id="noise-container" class="clusters-grid">
                </div>
        </div>

        <div id="manual-review" class="tab-content">
            <div class="manual-review-controls">
                <div>
                    <label for="sortBySelect">Sort By:</label>
                    <select id="sortBySelect" class="select-dropdown">
                        <option value="timestamp">Timestamp</option>
                        <option value="risk_score">Risk Score</option>
                        <option value="source">Log Source</option>
                        <option value="predicted_label">Model Prediction</option>
                    </select>
                </div>
                <div>
                    <label for="sortOrderSelect">Order:</label>
                    <select id="sortOrderSelect" class="select-dropdown">
                        <option value="desc">Descending</option>
                        <option value="asc">Ascending</option>
                    </select>
                </div>
                <button id="applySortBtn" class="control-button">Apply</button>
            </div>
            <div id="manual-log-table-container">
                </div>
        </div>
    </div>

    <div id="cluster-detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 1200px;">
            <div class="modal-header">
                <h2 id="cluster-modal-title">Cluster Details</h2>
                <button id="cluster-modal-close-btn" class="modal-close-button">&times;</button>
            </div>
            <div id="cluster-modal-body" class="modal-body"></div>
        </div>
    </div>
    <div id="toast-container"></div>

    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
