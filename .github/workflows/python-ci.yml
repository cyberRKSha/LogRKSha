# .github/workflows/python-ci.yml

name: Python Application Test

# This workflow runs on any push or pull request to the main branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # The job will run on the latest version of Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository's code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sets up the specific version of Python you are using
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installs your project's dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Runs your test suite using pytest
      # This is the step that passes or fails.
      - name: Run tests with pytest
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          SESSION_TIMEOUT_SECONDS: ${{ secrets.SESSION_TIMEOUT_SECONDS }}
          SEQUENCE_LEN: ${{ secrets.SEQUENCE_LEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_FILES_STR: ${{ secrets.LOG_FILES_STR }}
          SIMILARITY_THRESHOLD: ${{ secrets.SIMILARITY_THRESHOLD }}
        run: |
          pytest
