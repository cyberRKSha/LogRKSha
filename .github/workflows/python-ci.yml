# .github/workflows/python-ci.yml

name: Python Application Test

# This workflow runs on any push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # The job will run on the latest version of Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository's code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Sets up the specific version of Python you are using
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Installs your project's dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Runs your test suite using pytest
      # This is the step that passes or fails.
      - name: Run tests with pytest
        run: |
          pytest
